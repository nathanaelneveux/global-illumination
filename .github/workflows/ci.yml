name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The published crates only; the lab (root package) is not built in CI.
  CRATES: -p bevy_voxel_gi -p bevy_voxel_gi_bvw -p bevy_voxel_gi_debug

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The crates' rust-version (Bevy 0.19's minimum). Pinned so new clippy
      # lints on a newer stable do not fail CI unannounced; raise it
      # deliberately, with rust-version.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked $CRATES --all-targets -- -D warnings
      # GPU tests are #[ignore]d and need a native adapter: run them locally
      # with `cargo test -p bevy_voxel_gi --lib -- --include-ignored`.
      - name: CPU tests
        run: cargo test --locked $CRATES --lib --examples
      # The three crates only: with the lab, its bevy/dynamic_linking unifies
      # in and doctest binaries cannot load libstd. One command keeps Bevy's
      # feature set the same as the steps above (per crate rebuilt it thrice).
      - name: Doc tests
        run: cargo test --locked $CRATES --doc
      - name: Rustdoc
        run: cargo doc --locked --no-deps $CRATES
        env:
          RUSTDOCFLAGS: -D warnings
