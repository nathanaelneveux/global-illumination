[package]
name = "bevy_voxel_gi"
description = "GPU path-traced diffuse global illumination for voxel worlds in Bevy: sun, sky, emissive blocks and multi-bounce light"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/bevy_voxel_gi"
keywords = ["bevy", "voxel", "global-illumination", "path-tracing", "lighting"]
categories = ["game-development", "rendering"]

[dependencies]
bevy.workspace = true
wgpu.workspace = true
serde.workspace = true
ron.workspace = true
naga.workspace = true
# Host materials (and the stock VoxelGiStandardMaterial) override Bevy's
# directional light and shadow lookup, which are not `virtual`.
naga_oil = { version = "0.22", default-features = false, features = ["override_any"] }

[lints]
workspace = true
