[package]
name = "voxel_gi"
description = "Persistent diffuse global illumination for axis-aligned voxel worlds in Bevy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
wgpu.workspace = true
serde.workspace = true
ron.workspace = true
naga.workspace = true
# Host materials (and the stock VoxelGiStandardMaterial) override Bevy's
# directional light and shadow lookup, which are not `virtual`.
naga_oil = { version = "0.22", default-features = false, features = ["override_any"] }

[lints]
workspace = true
