[package]
name = "prototype_voxel_template"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0 OR MIT OR Apache-2.0"
description = "Voxel GI lab: the BVW prototype world, scenes and validation harness"
publish = false

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/nathanaelneveux/global-illumination"

[workspace.dependencies]
bevy = "0.19"
bevy_voxel_world = "0.17"
bevy_voxel_gi = { path = "crates/bevy_voxel_gi", version = "0.1.1" }
bevy_voxel_gi_bvw = { path = "crates/bevy_voxel_gi_bvw", version = "0.1.1" }
bevy_voxel_gi_debug = { path = "crates/bevy_voxel_gi_debug", version = "0.1.1" }
# "std" makes error scopes thread-local. Without it (Bevy disables wgpu's
# defaults) every thread shares one scope stack, and GI pipeline validation on
# a worker interleaved with Bevy's pipeline cache: "Mismatched pop_error_scope".
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
naga = { version = "29", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
ron = "0.11"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"

[features]
default = ["dev_native"]
dev = [
    "bevy/dynamic_linking",
    "bevy/track_location",
]
dev_native = [
    "dev",
    "bevy/file_watcher",
]
# Profile with Tracy 0.13 (protocol 76): `cargo run --features tracy`, then
# connect tracy-capture or the Tracy GUI. Adds per-system and render spans.
tracy = ["bevy/trace_tracy", "bevy/debug"]

[dependencies]
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "debug-plugin"] }
bevy = { workspace = true, features = ["bevy_feathers", "system_clipboard"] }
bevy_voxel_gi.workspace = true
bevy_voxel_gi_bvw.workspace = true
bevy_voxel_gi_debug.workspace = true
bevy_ahoy = "0.2"
bevy_asset_loader = "0.27"
bevy_common_assets = { version = "0.17", features = ["ron"] }
bevy_enhanced_input = "0.26"
bevy-inspector-egui = "0.37"
bevy_voxel_world = "0.17"
block-mesh = "0.2"
block-mesh-bgm = "0.2.4"
ndshape = "0.3"
noiz = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.11"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[lints]
workspace = true

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3
# Full debug symbols for Bevy/wgpu can consume tens of GB across feature sets.
# Keep application line tables while keeping dependency builds compact.
debug = 0

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
