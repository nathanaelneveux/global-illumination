<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave sampling comparison</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
  body { margin: 0 auto; padding: 24px; max-width: 1600px; color: CanvasText; background: Canvas; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
  h2 { font-size: 17px; font-weight: 500; }
  button, select, input { font: inherit; }
  [hidden] { display: none !important; }
  button, select { padding: 6px 10px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { outline: 2px solid Highlight; outline-offset: 2px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .muted { opacity: .75; }
  #caption { font-variant-numeric: tabular-nums; }
  #viewport { max-height: 78vh; overflow: auto; }
  #stage { position: relative; width: 100%; line-height: 0; touch-action: pan-x pan-y; }
  #stage img { display: block; width: 100%; height: auto; }
  #reference { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
  #divider { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: CanvasText; display: none; }
  #steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  #steps button { text-align: left; padding: 0; border: 0; background: transparent; color: inherit; }
  #steps img { width: 100%; height: auto; display: block; }
  #steps span { display: block; margin: 6px 0; font-variant-numeric: tabular-nums; }
  #error { color: CanvasText; background: Mark; padding: 8px; }
  @media (max-width: 600px) { body { padding: 12px; } .controls { gap: 10px; } }
</style>
<main id="cave-sample-gallery">
  <h1>Cave sampling comparison</h1>
  <p class="muted">Original 2560×1440 captures. Fixed scene and exposure; no temporal filtering. Reference: <span id="reference-count">loading…</span> paths per face. Arrow keys change sample count.</p>
  <div class="controls">
    <button id="previous" type="button" aria-label="Previous sample count">←</button>
    <label>Samples per face <select id="count"></select></label>
    <button id="next" type="button" aria-label="Next sample count">→</button>
    <label>Sequence window <select id="window"></select></label>
    <label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="1">100% · native pixels</option><option value="2">200%</option></select></label>
    <a id="original" target="_blank" rel="noopener">Open original PNG</a>
  </div>
  <div class="controls">
    <button id="hold" type="button">Hold to view reference</button>
    <label><input id="compare" type="checkbox">Wipe comparison</label>
    <label id="wipe-control" hidden>Reference on left <input id="wipe" type="range" min="0" max="100" value="50" aria-label="Reference comparison position"></label>
    <span id="caption" aria-live="polite"></span>
  </div>
  <p id="error" role="alert" hidden></p>
  <div id="viewport">
    <div id="stage">
      <img id="sample" alt="Selected cave sampling checkpoint" width="2560" height="1440">
      <img id="reference" alt="High-sample cave reference" width="2560" height="1440">
      <div id="divider" aria-hidden="true"></div>
    </div>
  </div>
  <h2>Every sample checkpoint</h2>
  <div id="steps"></div>
</main>
<script>
(async () => {
  const root = document.getElementById('cave-sample-gallery');
  const $ = id => root.querySelector('#' + id);
  const run = new URLSearchParams(location.search).get('run');
  if (!run || !/^cave-[0-9]+-[0-9]+$/.test(run)) {
    $('error').hidden = false; $('error').textContent = 'Select a valid cave run using ?run=cave-<timestamp>-<pid>.';
    return;
  }
  const base = '../target/gi-validation/' + encodeURIComponent(run) + '/';
  const response = await fetch(base + 'sample-gallery.json');
  if (!response.ok) throw new Error('Run cave_sample_analysis.py first to create the gallery manifest.');
  const manifest = await response.json();
  if (!manifest.qualified || !manifest.counts.length || manifest.sequence_starts.length !== 4) throw new Error('Invalid or unqualified gallery manifest.');
  const counts = manifest.counts;
  $('reference-count').textContent = manifest.reference_paths.toLocaleString();
  manifest.sequence_starts.forEach((start, i) => {
    const option = document.createElement('option'); option.value = i;
    option.textContent = (start === 0 ? 'Startup · ' : '') + start.toLocaleString();
    $('window').append(option);
  });
  const path = (n, w) => base + `samples-${n}-window-${w}.png`;
  let index = Math.max(0, counts.indexOf(256)), windowIndex = 0, holding = false;
  const buttons = counts.map((n, i) => {
    const option = document.createElement('option'); option.value = i; option.textContent = n.toLocaleString(); $('count').append(option);
    const button = document.createElement('button'); button.type = 'button'; button.setAttribute('aria-label', n.toLocaleString() + ' samples per face');
    const image = document.createElement('img'); image.alt = `Cave at ${n} samples per face`; image.loading = 'lazy'; image.width = 2560; image.height = 1440;
    const label = document.createElement('span'); label.textContent = n.toLocaleString() + ' samples per face'; button.append(image, label);
    button.addEventListener('click', () => { index = i; update(); $('viewport').scrollIntoView({block:'center'}); });
    $('steps').append(button); return {button, image};
  });
  const comparison = () => {
    const amount = holding ? 100 : ($('compare').checked ? Number($('wipe').value) : 0);
    $('reference').style.clipPath = `inset(0 ${100-amount}% 0 0)`;
    $('divider').style.left = amount + '%';
    $('divider').style.display = amount > 0 && amount < 100 ? 'block' : 'none';
    $('wipe-control').hidden = !$('compare').checked;
    $('caption').textContent = `${counts[index].toLocaleString()} samples · window ${windowIndex + 1} / 4${holding ? ' · reference shown' : ''}`;
  };
  const update = () => {
    $('count').value = index; $('window').value = windowIndex;
    $('sample').src = path(counts[index], windowIndex); $('original').href = $('sample').src;
    $('previous').disabled = index === 0; $('next').disabled = index === counts.length - 1;
    buttons.forEach(({button, image}, i) => { button.setAttribute('aria-pressed', String(i === index)); image.src = path(counts[i], windowIndex); });
    comparison();
  };
  $('reference').src = base + 'cave-reference.png';
  [$('sample'), $('reference')].forEach(image => image.addEventListener('error', () => { $('error').hidden = false; $('error').textContent = 'Capture failed to load: ' + image.src; }));
  $('count').addEventListener('change', e => { index = Number(e.target.value); update(); });
  $('window').addEventListener('change', e => { windowIndex = Number(e.target.value); update(); });
  $('previous').addEventListener('click', () => { index = Math.max(0,index-1); update(); });
  $('next').addEventListener('click', () => { index = Math.min(counts.length-1,index+1); update(); });
  $('compare').addEventListener('change', comparison); $('wipe').addEventListener('input', comparison);
  const zoom = () => {
    const value = $('zoom').value;
    $('stage').style.width = value === 'fit' ? '100%' : `${2560 * Number(value) / (window.devicePixelRatio || 1)}px`;
  };
  $('zoom').addEventListener('change', zoom); window.addEventListener('resize', zoom);
  $('hold').addEventListener('pointerdown', e => { e.preventDefault(); holding = true; e.target.setPointerCapture(e.pointerId); comparison(); });
  $('hold').addEventListener('pointerup', () => { holding = false; comparison(); });
  $('hold').addEventListener('pointercancel', () => { holding = false; comparison(); });
  $('hold').addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); holding = true; comparison(); } });
  $('hold').addEventListener('keyup', () => { holding = false; comparison(); });
  $('hold').addEventListener('blur', () => { holding = false; comparison(); });
  document.addEventListener('keydown', e => {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); index = Math.min(counts.length-1, Math.max(0, index + (e.key === 'ArrowRight' ? 1 : -1))); update();
    }
  });
  update();
})().catch(error => {
  const element = document.getElementById('error'); element.hidden = false; element.textContent = error.message;
});
</script>
</html>
